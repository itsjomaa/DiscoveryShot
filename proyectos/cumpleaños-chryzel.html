    <script>
        const images = Array.from({ length: 17 }, (_, i) => {
            const num = i + 1;
            return {
                src: `images/cumpleaños-Chryzel/Chryzel Alegado Seblario - Discovery Shot 25-${num}.jpg`, alt: `Cumpleaños Chryzel ${num}`
            };
        });
        const photoGrid = document.getElementById('photoGrid');

        images.forEach(img => {
            photoGrid.innerHTML +=
                `<div class="photo-item">
            <img src="${img.src}"
            alt="${img.alt}">
        </div>
        `;
        });
