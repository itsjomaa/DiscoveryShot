    <script>
        const images = Array.from({ length: 34 }, (_, i) => {
            const num = String(i + 1).padStart(2, '0');
            return {
                src: `images/eventos-Recital/IMG_${num}.jpg`, alt: `Eventos Recital ${num}`
            };
        });
        const photoGrid = document.getElementById('photoGrid');

        images.forEach(img => {
            photoGrid.innerHTML +=
                `<div class="photo-item">
            <img src="${img.src}"
            alt="${img.alt}">
        </div>
        `;
        });

    </script>
